[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scripture-rag"
version = "0.1.0"
description = "Grounded, cited question answering over public-domain PDF and TXT books"
authors = [{ name = "Igor Lima" }]
license = { text = "MIT" }
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["src/scripture_rag"]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E501"]
"bench/*" = ["B023"]
