<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 305" width="910" height="305" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#212529"><title>Data flow</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#495057"/></marker></defs><rect width="910" height="305" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="700">Data flow</text><rect x="20" y="55" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="85.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">PDF / TXT</text><text x="85.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">upload or IA</text><line x1="150" y1="85" x2="170" y2="85" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="170" y="55" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="235.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">Sanitize</text><text x="235.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">magic bytes, caps</text><line x1="300" y1="85" x2="320" y2="85" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="320" y="55" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="385.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">Extract pages</text><text x="385.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">pypdf / pdf.js</text><line x1="450" y1="85" x2="470" y2="85" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="470" y="55" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="535.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">Chunk</text><text x="535.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">page_start, page_end</text><line x1="600" y1="85" x2="620" y2="85" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="55" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="685.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">Embed + index</text><text x="685.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">BM25 postings, vectors</text><line x1="750" y1="85" x2="770" y2="85" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="770" y="55" width="130" height="60" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.5"/><text x="835.0" y="82.0" text-anchor="middle" font-size="13" font-weight="600">Store</text><text x="835.0" y="98.0" text-anchor="middle" font-size="11" font-weight="400">IndexedDB library</text><rect x="20" y="175" width="130" height="60" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/><text x="85.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600">Question</text><text x="85.0" y="218.0" text-anchor="middle" font-size="11" font-weight="400">en, pt, es</text><rect x="170" y="145" width="130" height="50" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="235.0" y="175.0" text-anchor="middle" font-size="13" font-weight="600">BM25 top k</text><rect x="170" y="215" width="130" height="50" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="235.0" y="245.0" text-anchor="middle" font-size="13" font-weight="600">Vector top k</text><rect x="320" y="175" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="385.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600">RRF fusion</text><text x="385.0" y="218.0" text-anchor="middle" font-size="11" font-weight="400">k = 60</text><rect x="470" y="175" width="130" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="535.0" y="202.0" text-anchor="middle" font-size="13" font-weight="600">Rerank</text><text x="535.0" y="218.0" text-anchor="middle" font-size="11" font-weight="400">top 5</text><rect x="620" y="175" width="130" height="60" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="685.0" y="210.0" text-anchor="middle" font-size="13" font-weight="600">Support gate</text><line x1="150" y1="200" x2="170" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="150" y1="210" x2="170" y2="238" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="300" y1="170" x2="320" y2="195" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="300" y1="240" x2="320" y2="215" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="205" x2="470" y2="205" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="600" y1="205" x2="620" y2="205" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><rect x="770" y="145" width="120" height="50" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.5"/><text x="830.0" y="167.0" text-anchor="middle" font-size="13" font-weight="600">Cited answer</text><text x="830.0" y="183.0" text-anchor="middle" font-size="11" font-weight="400">[book p.N #id]</text><rect x="770" y="215" width="120" height="50" rx="8" fill="#fff4e6" stroke="#e8590c" stroke-width="1.5"/><text x="830.0" y="237.0" text-anchor="middle" font-size="13" font-weight="600">Refusal</text><text x="830.0" y="253.0" text-anchor="middle" font-size="11" font-weight="400">not in texts</text><line x1="750" y1="195" x2="770" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="750" y1="215" x2="770" y2="238" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><line x1="835" y1="115" x2="835" y2="145" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/><text x="20" y="290" font-size="11" fill="#495057">Top row: ingest path (once per book). Bottom row: query path. Answer and question are saved to IndexedDB history.</text></svg>