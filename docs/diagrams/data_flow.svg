<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Data flow</title><desc id="d">Ingest path (top) builds the indexes; query path (bottom) reads them.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="1" y="1" width="958" height="798" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">Data flow</text><text x="32" y="66" font-size="14" fill="#4a525c">Ingest path (top) builds the indexes; query path (bottom) reads them.</text><rect x="20" y="84" width="920" height="150" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/><text x="36" y="108" font-size="14" font-weight="700" fill="#4a525c" letter-spacing="0.4">INGEST</text><rect x="40" y="124" width="198" height="76" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="40" y="134" width="4" height="56" rx="2" fill="#1c7ed6"/><text x="139.0" y="147.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Sanitize + parse</text><text x="139.0" y="167.0" text-anchor="middle" font-size="13" fill="#4a525c">PDF / TXT or IA item,</text><text x="139.0" y="187.0" text-anchor="middle" font-size="13" fill="#4a525c">text by page</text><rect x="268" y="124" width="198" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="268" y="134" width="4" height="56" rx="2" fill="#0ca678"/><text x="367.0" y="157.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Normalize</text><text x="367.0" y="177.0" text-anchor="middle" font-size="13" fill="#4a525c">archaic spelling</text><path d="M238,162.0 L266,162.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="495" y="124" width="198" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="495" y="134" width="4" height="56" rx="2" fill="#0ca678"/><text x="594.0" y="147.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Verse chunk</text><text x="594.0" y="167.0" text-anchor="middle" font-size="13" fill="#4a525c">80 words, 1 verse</text><text x="594.0" y="187.0" text-anchor="middle" font-size="13" fill="#4a525c">overlap</text><path d="M466,162.0 L493,162.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="722" y="124" width="198" height="76" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/><rect x="722" y="134" width="4" height="56" rx="2" fill="#495057"/><text x="821.0" y="147.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Indexes</text><text x="821.0" y="167.0" text-anchor="middle" font-size="13" fill="#4a525c">BM25 + vectors</text><text x="821.0" y="187.0" text-anchor="middle" font-size="13" fill="#4a525c">IndexedDB</text><path d="M693,162.0 L720,162.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="20" y="250" width="920" height="530" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-dasharray="6 4"/><text x="36" y="274" font-size="14" font-weight="700" fill="#4a525c" letter-spacing="0.4">QUERY</text><rect x="32" y="290" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="32" y="300" width="4" height="56" rx="2" fill="#7048e8"/><text x="130.5" y="323.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Question</text><text x="130.5" y="343.0" text-anchor="middle" font-size="13" fill="#4a525c">English or Spanish</text><rect x="265" y="290" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="265" y="300" width="4" height="56" rx="2" fill="#7048e8"/><text x="363.5" y="323.0" text-anchor="middle" font-siz