<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="system-ui,Segoe UI,Arial,sans-serif" fill="#212529"><title>Architecture</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#495057"/></marker></defs><rect width="900" height="490" fill="#ffffff"/><text x="20" y="28" font-size="16" font-weight="700">Architecture</text><rect x="15" y="45" width="870" height="235" rx="10" fill="none" stroke="#adb5bd" stroke-dasharray="5 4"/><text x="25" y="62" font-size="11" fill="#868e96">Browser (site/, fully client side)</text><rect x="35" y="80" width="150" height="60" rx="8" fill="#f1f3f5" stroke="#495057" stroke-width="1.5"/><text x="110.0" y="107.0" text-anchor="middle" font-size="13" font-weight="600">UI tabs</text><text x="110.0" y="123.0" text-anchor="middle" font-size="11" font-weight="400">Ask, Library, Themes, Compare</text><rect x="235" y="80" width="150" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="310.0" y="107.0" text-anchor="middle" font-size="13" font-weight="600">Ingest</text><text x="310.0" y="123.0" text-anchor="middle" font-size="11" font-weight="400">pdf.js / txt, chunker</text><rect x="435" y="80" width="170" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke-width="1.5"/><text x="520.0" y="107.0" text-anchor="middle" font-size="13" font-weight="600">Embedder</text><text x="520.0" y="123.0" text-anchor="middle" font-size="11" font-weight="400">hashing or multilingual-e5</text><rect x="655" y="80" width="210" height="60" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.5"/><text x="760.0" y="107.0" text-anchor="middle" font-size="13" font-weight="600">Library manifest</text><text x="760.0" y="123.0" text-anchor="middle" font-size="11" font-weight="400">auto-tags, roles, CSV/JSON</text><rect x="235" y="190" width="150" height="60" rx="8" fill="#eef2ff" stroke="#3b5bdb" stroke