<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Ingest pipeline</title><desc id="d">Each book is checked, parsed page by page, normalized, chunked by verse and indexed.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="1" y="1" width="958" height="370" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">Ingest pipeline</text><text x="32" y="66" font-size="14" fill="#4a525c">Each book is checked, parsed page by page, normalized, chunked by verse and indexed.</text><rect x="32" y="96" width="275" height="76" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="32" y="106" width="4" height="56" rx="2" fill="#1c7ed6"/><text x="169.5" y="119.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Upload checks</text><text x="169.5" y="139.0" text-anchor="middle" font-size="13" fill="#4a525c">magic bytes, size</text><text x="169.5" y="159.0" text-anchor="middle" font-size="13" fill="#4a525c">and page caps</text><rect x="343" y="96" width="275" height="76" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="343" y="106" width="4" height="56" rx="2" fill="#1c7ed6"/><text x="480.5" y="119.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Parse pages</text><text x="480.5" y="139.0" text-anchor="middle" font-size="13" fill="#4a525c">pypdf / pdf.js</text><text x="480.5" y="159.0" text-anchor="middle" font-size="13" fill="#4a525c">with a timeout</text><path d="M307,134.0 L341,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="653" y="96" width="275" height="76" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="653" y="106" width="4" height="56" rx="2" fill="#1c7ed6"/><text x="790.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Strip control chars</text><text x="790.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">escape all output</text><path d="M618,134.0 L651,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="32" y="228" width="275" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="32" y="238" width="4" height="56" rx="2" fill="#0ca678"/><text x="169.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Normalize archaic</text><text x="169.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">thee, saith, -eth ...</text><rect x="343" y="228" width="275" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="343" y="238" width="4" height="56" rx="2" fill="#0ca678"/><text x="480.5" y="251.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Verse chunks</text><text x="480.5" y="271.0" text-anchor="middle" font-size="13" fill="#4a525c">about 80 words,</text><text x="480.5" y="291.0" text-anchor="middle" font-size="13" fill="#4a525c">1 verse overlap</text><path d="M307,266.0 L341,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="653" y="228" width="275" height="76" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/><rect x="653" y="238" width="4" height="56" rx="2" fill="#495057"/><text x="790.5" y="251.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Embed + index</text><text x="790.5" y="271.0" text-anchor="middle" font-size="13" fill="#4a525c">BM25 + e5 vectors,</text><text x="790.5" y="291.0" text-anchor="middle" font-size="13" fill="#4a525c">HNSW above 20k</text><path d="M618,266.0 L651,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M790.5,172 L790.5,200.0 L169.5,200.0 L169.5,226" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><text x="480.0" y="350" text-anchor="middle" font-size="13" font-weight="400" fill="#4a525c">No verse numbers found: 200-token windows with 40-token overlap instead.</text></svg>
