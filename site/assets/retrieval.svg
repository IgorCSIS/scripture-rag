<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Answering a question</title><desc id="d">Extractive only: every answer is a quoted passage with a citation, or a refusal.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="1" y="1" width="958" height="558" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">Answering a question</text><text x="32" y="66" font-size="14" fill="#4a525c">Extractive only: every answer is a quoted passage with a citation, or a refusal.</text><rect x="32" y="96" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="32" y="106" width="4" height="56" rx="2" fill="#7048e8"/><text x="130.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Question</text><text x="130.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">EN, PT or ES</text><rect x="265" y="96" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="265" y="106" width="4" height="56" rx="2" fill="#7048e8"/><text x="363.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">clean_query</text><text x="363.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">tidy the raw text</text><path d="M229,134.0 L263,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="498" y="96" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="498" y="106" width="4" height="56" rx="2" fill="#7048e8"/><text x="596.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Detect language</text><text x="596.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">en / pt / es</text><path d="M462,134.0 L496,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="731" y="96" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="731" y="106" width="4" height="56" rx="2" fill="#7048e8"/><text x="829.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Translate to EN</text><text x="829.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">MarianMT, PT/ES only</text><path d="M695,134.0 L729,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="32" y="228" width="197" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="32" y="238" width="4" height="56" rx="2" fill="#7048e8"/><text x="130.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Normalize + expand</text><text x="130.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">archaic forms, synonyms</text><rect x="265" y="228" width="197" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="265" y="238" width="4" height="56" rx="2" fill="#0ca678"/><text x="363.5" y="251.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">BM25</text><text x="363.5" y="271.0" text-anchor="middle" font-size="13" fill="#4a525c">translated query</text><text x="363.5" y="291.0" text-anchor="middle" font-size="13" fill="#4a525c">+ original query</text><path d="M229,266.0 L263,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="498" y="228" width="197" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="498" y="238" width="4" height="56" rx="2" fill="#0ca678"/><text x="596.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Dense search</text><text x="596.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">multilingual-e5-small</text><path d="M462,266.0 L496,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="731" y="228" width="197" height="76" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="731" y="238" width="4" height="56" rx="2" fill="#e8590c"/><text x="829.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Weighted RRF</text><text x="829.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">fuse both rankings</text><path d="M695,266.0 L729,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M829.5,172 L829.5,200.0 L130.5,200.0 L130.5,226" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="32" y="360" width="197" height="76" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="32" y="370" width="4" height="56" rx="2" fill="#e8590c"/><text x="130.5" y="383.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Rerank top 50</text><text x="130.5" y="403.0" text-anchor="middle" font-size="13" fill="#4a525c">cross-encoder</text><text x="130.5" y="423.0" text-anchor="middle" font-size="13" fill="#4a525c">mmarco-mMiniLMv2</text><rect x="265" y="360" width="197" height="76" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/><rect x="265" y="370" width="4" height="56" rx="2" fill="#e67700"/><text x="363.5" y="393.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Language gate</text><text x="363.5" y="413.0" text-anchor="middle" font-size="13" fill="#4a525c">score &gt;= t[lang]</text><path d="M229,398.0 L263,398.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="498" y="360" width="197" height="76" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/><rect x="498" y="370" width="4" height="56" rx="2" fill="#e67700"/><text x="596.5" y="393.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Support gate</text><text x="596.5" y="413.0" text-anchor="middle" font-size="13" fill="#4a525c">lexical support &gt;= 0.3</text><path d="M462,398.0 L496,398.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="731" y="360" width="197" height="76" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="731" y="370" width="4" height="56" rx="2" fill="#2f9e44"/><text x="829.5" y="393.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Cited verse quotes</text><text x="829.5" y="413.0" text-anchor="middle" font-size="13" fill="#4a525c">top 3, [book p.N #id]</text><path d="M695,398.0 L729,398.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M829.5,304 L829.5,332.0 L130.5,332.0 L130.5,358" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M462,398.0 L496,398.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="462.47" y="372.0" width="33.06" height="20" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="479" y="387.0" text-anchor="middle" font-size="13" fill="#1f2328">yes</text><path d="M695,398.0 L729,398.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="695.47" y="372.0" width="33.06" height="20" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="712" y="387.0" text-anchor="middle" font-size="13" fill="#1f2328">yes</text><rect x="265" y="496" width="430" height="64" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="265" y="506" width="4" height="44" rx="2" fill="#e03131"/><text x="480.0" y="523.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Refuse</text><text x="480.0" y="543.0" text-anchor="middle" font-size="13" fill="#4a525c">“I could not find this in the loaded texts.”</text><path d="M363.5,436 L363.5,494" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/>