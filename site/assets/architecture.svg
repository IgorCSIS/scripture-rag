<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">System overview</title><desc id="d">Everything runs on your device. Nothing is generated: answers are quoted passages.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="1" y="1" width="958" height="478" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">System overview</text><text x="32" y="66" font-size="14" fill="#4a525c">Everything runs on your device. Nothing is generated: answers are quoted passages.</text><rect x="32" y="96" width="275" height="80" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="32" y="106" width="4" height="60" rx="2" fill="#1c7ed6"/><text x="169.5" y="121.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Your books</text><text x="169.5" y="141.0" text-anchor="middle" font-size="13" fill="#4a525c">PDF / TXT or</text><text x="169.5" y="161.0" text-anchor="middle" font-size="13" fill="#4a525c">Internet Archive</text><rect x="343" y="96" width="275" height="80" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/><rect x="343" y="106" width="4" height="60" rx="2" fill="#1c7ed6"/><text x="480.5" y="121.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Ingest</text><text x="480.5" y="141.0" text-anchor="middle" font-size="13" fill="#4a525c">checks, pages,</text><text x="480.5" y="161.0" text-anchor="middle" font-size="13" fill="#4a525c">verse chunks</text><path d="M307,136.0 L341,136.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="653" y="96" width="275" height="80" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/><rect x="653" y="106" width="4" height="60" rx="2" fill="#495057"/><text x="790.5" y="121.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Indexes</text><text x="790.5" y="141.0" text-anchor="middle" font-size="13" fill="#4a525c">BM25 + e5 vectors</text><text x="790.5" y="161.0" text-anchor="middle" font-size="13" fill="#4a525c">in IndexedDB</text><path d="M618,136.0 L651,136.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="32" y="236" width="275" height="80" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="32" y="246" width="4" height="60" rx="2" fill="#7048e8"/><text x="169.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Question</text><text x="169.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">cleaned, detected,</text><text x="169.5" y="301.0" text-anchor="middle" font-size="13" fill="#4a525c">translated to EN</text><rect x="343" y="236" width="275" height="80" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.6"/><rect x="343" y="246" width="4" height="60" rx="2" fill="#e8590c"/><text x="480.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Hybrid + rerank</text><text x="480.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">RRF, top 50,</text><text x="480.5" y="301.0" text-anchor="middle" font-size="13" fill="#4a525c">cross-encoder</text><path d="M307,276.0 L341,276.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="653" y="236" width="275" height="80" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/><rect x="653" y="246" width="4" height="60" rx="2" fill="#e67700"/><text x="790.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Two gates</text><text x="790.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">score &gt;= t[lang],</text><text x="790.5" y="301.0" text-anchor="middle" font-size="13" fill="#4a525c">support &gt;= 0.3</text><path d="M618,276.0 L651,276.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><path d="M790.5,176 L790.5,206 L480.5,206 L480.5,234" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="343" y="366" width="275" height="64" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="343" y="376" width="4" height="44" rx="2" fill="#2f9e44"/><text x="480.5" y="393.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Cited quotes</text><text x="480.5" y="413.0" text-anchor="middle" font-size="13" fill="#4a525c">[book p.N #id]</text><rect x="653" y="366" width="275" height="64" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="1.6"/><rect x="653" y="376" width="4" height="44" rx="2" fill="#e03131"/><text x="790.5" y="393.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Refusal</text><text x="790.5" y="413.0" text-anchor="middle" font-size="13" fill="#4a525c">not in loaded texts</text><path d="M790.5,316 L790.5,364" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="797.48" y="330" width="26.04" height="20" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="810.5" y="345" text-anchor="middle" font-size="13" fill="#1f2328">no</text><path d="M663,316 L608,364" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="622.47" y="330" width="33.06" height="20" rx="6" fill="#ffffff" stroke="#d0d7de"/><text x="639" y="345" text-anchor="middle" font-size="13" fill="#1f2328">yes</text></svg>
