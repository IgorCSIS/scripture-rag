<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><title id="t">Unsupervised theme map</title><desc id="d">Clusters are statistical similarity, not doctrinal claims.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker></defs><rect x="1" y="1" width="958" height="328" rx="18" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><text x="32" y="42" font-size="20" font-weight="700" fill="#1f2328">Unsupervised theme map</text><text x="32" y="66" font-size="14" fill="#4a525c">Clusters are statistical similarity, not doctrinal claims.</text><rect x="32" y="96" width="197" height="76" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="1.6"/><rect x="32" y="106" width="4" height="56" rx="2" fill="#495057"/><text x="130.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Passage vectors</text><text x="130.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">e5 embeddings</text><rect x="265" y="96" width="197" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="265" y="106" width="4" height="56" rx="2" fill="#0ca678"/><text x="363.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">k-means</text><text x="363.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">K by silhouette</text><path d="M229,134.0 L263,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="498" y="96" width="197" height="76" rx="12" fill="#e6fcf5" stroke="#0ca678" stroke-width="1.6"/><rect x="498" y="106" width="4" height="56" rx="2" fill="#0ca678"/><text x="596.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">PCA to 2D</text><text x="596.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">map layout</text><path d="M462,134.0 L496,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="731" y="96" width="197" height="76" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/><rect x="731" y="106" width="4" height="56" rx="2" fill="#2f9e44"/><text x="829.5" y="129.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">TF-IDF labels</text><text x="829.5" y="149.0" text-anchor="middle" font-size="13" fill="#4a525c">class-based keywords</text><path d="M695,134.0 L729,134.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="32" y="228" width="275" height="76" rx="12" fill="#fff9db" stroke="#e67700" stroke-width="1.6"/><rect x="32" y="238" width="4" height="56" rx="2" fill="#e67700"/><text x="169.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Outlier flags</text><text x="169.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">centroid z-score &gt; 2.5</text><rect x="343" y="228" width="275" height="76" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.6"/><rect x="343" y="238" width="4" height="56" rx="2" fill="#1971c2"/><text x="480.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Theme map</text><text x="480.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">re-clusters on change</text><path d="M307,266.0 L341,266.0" fill="none" stroke="#57606a" stroke-width="1.8" marker-end="url(#ah)"/><rect x="653" y="228" width="275" height="76" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.6"/><rect x="653" y="238" width="4" height="56" rx="2" fill="#7048e8"/><text x="790.5" y="261.0" text-anchor="middle" font-size="15" font-weight="650" fill="#1f2328">Similar passages</text><text x="790.5" y="281.0" text-anchor="middle" font-size="13" fill="#4a525c">nearest, other books</text><path d="M618,266.0 L651,266.0" fill="none